name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dev-launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: server/go.sum
      - run: npm ci
        working-directory: web
      - run: node --test scripts/dev.test.mjs
        env:
          DEV_SMOKE: '1'
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: server/go.sum
      - run: npm ci && npm run format:check && npm test && npm run build
        working-directory: web
      - run: go test ./... && go vet ./...
        working-directory: server
      - run: go build -o ../../squirrel-test-server .
        working-directory: server
      - run: npm ci && npx playwright install --with-deps chromium && npm test
        working-directory: tests/browser
        env:
          KANBAN_TEST_BINARY: ${{ github.workspace }}/../squirrel-test-server
      - name: Validate Compose and smoke-test image
        env:
          KANBAN_ADMIN_PASS: ci-only-initial-password
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.preview.yml config -q
          docker compose up -d --build --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8080/healthz
          docker compose exec -T kanban sh -c 'test "$(id -u)" = 10001 && test -w /data && ! touch /usr/local/rootfs-write-test'
          docker compose exec -T kanban sh -c 'test -s /data/kanban.db && echo smoke > /data/.ci-persistence'
          docker compose restart kanban
          docker compose up -d --wait --wait-timeout 120
          docker compose exec -T kanban sh -c 'test -s /data/kanban.db && test "$(cat /data/.ci-persistence)" = smoke'
      - name: Real Office conversion (optional deployment profile)
        env:
          KANBAN_ADMIN_PASS: ci-only-initial-password
        run: |
          docker compose -f docker-compose.yml -f docker-compose.preview.yml up -d --wait --wait-timeout 180
          docker compose -f docker-compose.yml -f docker-compose.preview.yml cp tests/fixtures/preview.doc preview:/tmp/preview-smoke.doc
          docker compose -f docker-compose.yml -f docker-compose.preview.yml exec -T preview curl --fail --silent --show-error --max-time 90 --form files=@/tmp/preview-smoke.doc http://localhost:3000/forms/libreoffice/convert > /tmp/preview-smoke.pdf
          test "$(head -c 5 /tmp/preview-smoke.pdf)" = '%PDF-'
      - name: Release inventory
        run: |
          mkdir -p release-artifacts
          npm --prefix web sbom --package-lock-only --sbom-format cyclonedx > release-artifacts/web-sbom.json
          (cd server && go list -m all) > release-artifacts/go-modules.txt
          docker image inspect squirrel-kanban:latest > release-artifacts/image.json
          git rev-parse HEAD > release-artifacts/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: release-artifacts/
      - name: Cleanup test containers
        if: always()
        env:
          KANBAN_ADMIN_PASS: ci-only-initial-password
        run: docker compose -f docker-compose.yml -f docker-compose.preview.yml down -v
